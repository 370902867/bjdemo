    <!-- 图表和地图绘制函数 -->
    <script>
        // 自定义简单图表绘制函数
        function drawSimpleChart(canvasId, type, data) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            if (!ctx) return;
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 获取数据
            const labels = data.labels || [];
            const datasets = data.datasets || [];
            
            if (labels.length === 0 || datasets.length === 0) return;
            
            // 绘制折线图
            if (type === 'line') {
                drawLineChart(ctx, canvas, labels, datasets);
            }
            // 绘制环形图
            else if (type === 'doughnut') {
                drawDoughnutChart(ctx, canvas, labels, datasets);
            }
        }
        
        // 绘制折线图
        function drawLineChart(ctx, canvas, labels, datasets) {
            // 图表边距
            const margin = {
                top: 30,
                right: 30,
                bottom: 40,
                left: 40
            };
            
            const chartWidth = canvas.width - margin.left - margin.right;
            const chartHeight = canvas.height - margin.top - margin.bottom;
            
            // 找出数据的最大最小值
            let minValue = Infinity;
            let maxValue = -Infinity;
            
            datasets.forEach(dataset => {
                dataset.data.forEach(value => {
                    if (value < minValue) minValue = value;
                    if (value > maxValue) maxValue = value;
                });
            });
            
            // 添加一些缓冲
            const buffer = (maxValue - minValue) * 0.1;
            minValue -= buffer;
            maxValue += buffer;
            
            // 计算刻度间隔
            const xScale = chartWidth / (labels.length - 1);
            const yScale = chartHeight / (maxValue - minValue);
            
            // 绘制网格线
            ctx.strokeStyle = '#e5e7eb';
            ctx.lineWidth = 1;
            
            // 垂直网格线
            labels.forEach((label, index) => {
                const x = margin.left + index * xScale;
                ctx.beginPath();
                ctx.moveTo(x, margin.top);
                ctx.lineTo(x, canvas.height - margin.bottom);
                ctx.stroke();
            });
            
            // 水平网格线（5条）
            for (let i = 0; i <= 5; i++) {
                const y = canvas.height - margin.bottom - (chartHeight * i / 5);
                ctx.beginPath();
                ctx.moveTo(margin.left, y);
                ctx.lineTo(canvas.width - margin.right, y);
                ctx.stroke();
            }
            
            // 绘制坐标轴
            ctx.strokeStyle = '#6b7280';
            ctx.lineWidth = 2;
            
            // X轴
            ctx.beginPath();
            ctx.moveTo(margin.left, canvas.height - margin.bottom);
            ctx.lineTo(canvas.width - margin.right, canvas.height - margin.bottom);
            ctx.stroke();
            
            // Y轴
            ctx.beginPath();
            ctx.moveTo(margin.left, margin.top);
            ctx.lineTo(margin.left, canvas.height - margin.bottom);
            ctx.stroke();
            
            // 绘制折线
            datasets.forEach(dataset => {
                ctx.strokeStyle = dataset.borderColor || '#3498db';
                ctx.lineWidth = dataset.borderWidth || 2;
                ctx.beginPath();
                
                // 虚线样式
                if (dataset.borderDash) {
                    ctx.setLineDash(dataset.borderDash);
                } else {
                    ctx.setLineDash([]);
                }
                
                dataset.data.forEach((value, index) => {
                    const x = margin.left + index * xScale;
                    const y = canvas.height - margin.bottom - ((value - minValue) * yScale);
                    
                    if (index === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                    
                    // 绘制点
                    if (dataset.pointRadius !== 0) {
                        ctx.fillStyle = dataset.borderColor || '#3498db';
                        ctx.beginPath();
                        ctx.arc(x, y, dataset.pointRadius || 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
                
                ctx.stroke();
            });
            
            // 绘制标签
            ctx.fillStyle = '#374151';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            
            // X轴标签
            labels.forEach((label, index) => {
                const x = margin.left + index * xScale;
                ctx.fillText(label, x, canvas.height - margin.bottom + 20);
            });
            
            // Y轴标签（每10%）
            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const value = minValue + ((maxValue - minValue) * i / 5);
                const y = canvas.height - margin.bottom - (chartHeight * i / 5);
                ctx.fillText(value.toFixed(1), margin.left - 10, y + 4);
            }
            
            // 绘制图例
            drawLegend(ctx, canvas, datasets, margin);
        }
        
        // 绘制环形图
        function drawDoughnutChart(ctx, canvas, labels, datasets) {
            if (datasets.length === 0) return;
            
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) / 3;
            const holeRadius = radius * 0.5;
            
            const dataset = datasets[0];
            const data = dataset.data;
            
            // 计算总和
            const total = data.reduce((sum, value) => sum + value, 0);
            
            let currentAngle = -Math.PI / 2; // 从顶部开始
            
            data.forEach((value, index) => {
                const sliceAngle = (value / total) * 2 * Math.PI;
                const endAngle = currentAngle + sliceAngle;
                const color = dataset.backgroundColor[index] || `hsl(${(index * 60) % 360}, 70%, 60%)`;
                
                // 绘制扇形
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, currentAngle, endAngle);
                ctx.arc(centerX, centerY, holeRadius, endAngle, currentAngle, true);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                
                // 绘制边框
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // 更新角度
                currentAngle = endAngle;
            });
            
            // 绘制图例
            drawLegend(ctx, canvas, datasets, { top: 10, right: 10, bottom: 10, left: 10 });
        }
        
        // 绘制图例
        function drawLegend(ctx, canvas, datasets, margin) {
            ctx.fillStyle = '#374151';
            ctx.font = '12px Arial';
            
            let legendY = margin.top;
            let legendX = margin.left;
            
            datasets.forEach(dataset => {
                const color = dataset.borderColor || dataset.backgroundColor[0] || '#3498db';
                
                // 绘制颜色方块
                ctx.fillStyle = color;
                ctx.fillRect(legendX, legendY, 12, 12);
                
                // 绘制标签
                ctx.fillStyle = '#374151';
                ctx.textAlign = 'left';
                ctx.fillText(dataset.label, legendX + 20, legendY + 8);
                
                legendX += 100;
            });
        }
        
        // 改进的地图绘制函数 - 适配北京市地图背景
        function drawSimpleMap(mapContainerId, districts) {
            const container = document.getElementById(mapContainerId);
            if (!container) return;
            
            // 获取容器尺寸
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            
            // 清空容器
            container.innerHTML = '';
            
            // 创建地图背景 - 北京市地区轮廓
            const mapBg = document.createElement('div');
            mapBg.className = 'simple-map';
            mapBg.style.width = `${containerWidth}px`;
            mapBg.style.height = `${containerHeight}px`;
            container.appendChild(mapBg);
            
            // 根据数值范围设置颜色
            const getColorByValue = (value) => {
                if (value >= 95) return '#4caf50'; // 优秀 - 绿色
                if (value >= 90) return '#2196f3'; // 良好 - 蓝色
                if (value >= 85) return '#ffc107'; // 一般 - 黄色
                if (value >= 80) return '#ff9800'; // 较差 - 橙色
                return '#f44336'; // 差 - 红色
            };
            
            // 添加地图点 - 调整坐标以适配北京市地图背景
            districts.forEach(district => {
                if (!district.x || !district.y || !district.value) return;
                
                // 创建点
                const point = document.createElement('div');
                point.className = 'map-point';
                
                // 调整坐标使点位置更适合北京市地图背景
                const scaleX = containerWidth / 400; // 基于SVG宽度400
                const scaleY = containerHeight / 300; // 基于SVG高度300
                const adjustedX = district.x * scaleX;
                const adjustedY = district.y * scaleY;
                
                point.style.left = `${adjustedX - 6}px`; // 中心点
                point.style.top = `${adjustedY - 6}px`;
                point.style.backgroundColor = getColorByValue(district.value);
                
                // 添加悬停效果
                point.addEventListener('mouseover', function() {
                    // 创建标签
                    const label = document.createElement('div');
                    label.className = 'map-label';
                    
                    // 调整标签位置以适配北京市地图背景
                    label.style.left = `${adjustedX + 10}px`;
                    label.style.top = `${adjustedY - 20}px`;
                    
                    // 格式化显示文本，包含状态信息
                    let status = '';
                    if (district.value >= 95) status = '优秀';
                    else if (district.value >= 90) status = '良好';
                    else if (district.value >= 85) status = '一般';
                    else if (district.value >= 80) status = '较差';
                    else status = '差';
                    
                    label.textContent = `${district.name}: ${district.value}% (${status})`;
